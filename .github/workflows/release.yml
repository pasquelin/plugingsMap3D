# Publication npm automatique des plugins publiables. Se déclenche sur un tag `vX.Y.Z`.
# Le tag EST la release : garde-fou (tag == version de CHAQUE paquet publié), build, puis
# `npm publish` avec provenance (attestation supply-chain liée à ce workflow).
#
# Flux côté mainteneur :
#   pnpm version:plugins 0.2.0        # aligne racine + geopf + windy
#   git commit -am "chore(release): 0.2.0" && git tag v0.2.0
#   git push --follow-tags            # → ce workflow publie les 2 paquets
#
# Authentification : npm Trusted Publishing (OIDC) — aucun token. Le trusted publisher
# doit être configuré côté npm : scope @map3d → pasquelin/plugingsMap3D → release.yml.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # requis pour `npm publish --provenance`

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Installer pnpm
        uses: pnpm/action-setup@v6

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing exige npm >= 11.5.1 ; Node 22 embarque npm 10.
      - name: Mettre npm à jour (requis pour l'OIDC)
        run: npm install -g npm@latest

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Garde-fou : le tag doit correspondre à la version de CHAQUE paquet publié, sinon on
      # publierait une version qui ne colle pas au code taggé.
      - name: Vérifier tag == version des paquets publiés
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for dir in packages/geopf packages/windy; do
            PKG="$(node -p "require('./$dir/package.json').version")"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::Tag v$TAG ≠ $dir $PKG"; exit 1
            fi
          done

      # Même barrière que la CI (typecheck strict, lint, format, tests) avant de publier.
      - name: Valider
        run: pnpm validater

      - name: Build (dist/ ESM + CJS + types)
        run: pnpm build

      # Sans token : l'OIDC trusted publisher authentifie. `npm publish` par dossier de
      # paquet (la provenance et l'OIDC passent par npm, pas par `pnpm publish -r`).
      - name: Publier @map3d/plugin-geopf
        run: npm publish --provenance --access public
        working-directory: packages/geopf

      - name: Publier @map3d/plugin-windy
        run: npm publish --provenance --access public
        working-directory: packages/windy
