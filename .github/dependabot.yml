# Veille de dépendances : un lot par semaine, groupé pour éviter le bruit de PR.
version: 2
updates:
  # Dépendances npm du monorepo (racine + packages + exemples).
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
      - "/packages/*/example"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      outillage:
        patterns: ["typescript", "eslint*", "typescript-eslint", "prettier", "vite*", "vitest", "@vitejs/*"]
      types:
        patterns: ["@types/*"]
    ignore:
      # Peer deps : la contrainte est volontairement large, on ne la bump pas automatiquement.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "three"
      - dependency-name: "@pasquelin/map3d"

  # Actions du workflow CI/release.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
